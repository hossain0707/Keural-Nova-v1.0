# Stage 4 — Keural v1.2 SFT. Goal: better Korean + better tool-calling (incl. up to
# 32k context), with NO measurable regression vs base (skill/style-focused, not
# knowledge-injection). Fresh from Qwen base. Derived from train_full.yaml; only the
# marked lines change. Rationale in comments.
#
# PRESERVATION RECIPE (vs v1.0 train_full.yaml):
#   rank 32 -> 16      (less capacity to overwrite base knowledge = less forgetting)
#   LR 1e-4 -> 5e-5    (directly reduces catastrophic forgetting; v1 drift came from 1e-4)
#   epochs 2 -> 1      (epoch 2 gave ~0 eval gain, only forgetting risk — measured in v1)
#   data: v2 (already clean/balanced/replay/de-contaminated) + tool-use slices
#
# train.py converts swift_args -> `swift sft` CLI verbatim. Keep valid ms-swift 4.4.0 keys.

run_name: "keural-v12"
output_dir: "outputs/v12"            # checkpoints under outputs/v12/<run timestamp>

nproc_per_node: 2
cuda_visible_devices: "0,1"

require_target_verification: true    # train.py gate: verify_lora_targets.py --pre must pass

swift_args:
  model: "Qwen/Qwen3.6-35B-A3B"      # fresh from BASE (never from v1.0/v1.1) — v2 plan §3
  use_hf: true                       # REQUIRED (ms-swift defaults to ModelScope) — re-downloads 70GB otherwise
  tuner_type: lora                   # ms-swift 4.4.0 name for train_type

  # --- data mix: v2 (Korean/clean-code/replay/MCQ, test-split excluded, identity de-contam)
  #     + tool-use slices (built by scripts/build_tooluse_slice.py). ms-swift accepts a list;
  #     no need to physically merge. NOTE: if the tool-use rows carry a per-row "tools" field
  #     (confirm from data/tooluse/README.md), ms-swift + the Qwen template render the XML.
  #     Optional identity: add "data/identity/keural_identity.jsonl" — but at 200 rows it is
  #     too diluted to stick; upweight (repeat ~5-10x) if you want the Keural identity baked in.
  dataset:
    - "data/processed_v2/train.jsonl"
    - "data/tooluse/tooluse_short.jsonl"
    - "data/tooluse/tooluse_long32k.jsonl"
  val_dataset: ["data/processed_v2/eval.jsonl"]

  # --- LoRA targeting (unchanged — the MoE-aware targeting is the whole pipeline; VERIFIED-FACTS §2,§5)
  target_modules: [q_proj, k_proj, v_proj, o_proj,
                   in_proj_qkv, in_proj_z, in_proj_b, in_proj_a, out_proj,
                   gate_proj, up_proj, down_proj]
  target_parameters: [gate_up_proj, down_proj]   # fused routed-expert nn.Parameters
  lora_rank: 16                      # CHANGED 32->16: preservation (less overwrite of base)
  lora_alpha: 32                     # CHANGED 64->32: keep alpha = 2*rank
  lora_dropout: 0.0                  # REQUIRED 0.0 (peft ParamWrapper crashes otherwise)
  freeze_vit: true
  freeze_aligner: true

  # --- data/template ---
  max_length: 32768                  # CHANGED 8192->32768: admit the up-to-32k tool-use slice.
                                     # ⚠ MEMORY: sdpa attention at 32k is O(n^2) and flash_attn
                                     # is NOT installed (VERIFIED-FACTS §1). If this OOMs, either
                                     # install flash-attn, OR drop to 16384, OR shrink/shorten the
                                     # long slice. Bulk rows are ~8k; only the long slice is big.
  truncation_strategy: delete        # drop over-length rather than corrupt
  loss_scale: ignore_empty_think     # zero loss on the empty <think></think> non-thinking scaffold
  padding_free: false
  packing: false

  # --- optimization (preservation-tuned) ---
  torch_dtype: bfloat16
  num_train_epochs: 1                # CHANGED 2->1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16    # effective batch 32 (drop to 8 if long-seq memory is tight)
  learning_rate: 5.0e-5              # CHANGED 1e-4->5e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  gradient_checkpointing: true
  deepspeed: zero2
  attn_impl: sdpa                    # flash_attn not installed; consider installing it for the 32k slice

  # --- moe ---
  router_aux_loss_coef: 0.001        # router stays frozen; keep model's own value

  # --- logging / checkpointing ---
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
  save_total_limit: 3
  save_only_model: false             # keep optimizer state => resumable
  report_to: [tensorboard]
  seed: 42
  dataloader_num_workers: 4
