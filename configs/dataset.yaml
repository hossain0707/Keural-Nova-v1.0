# Stage 1 — dataset build config. See VERIFIED-FACTS.md §4 for provenance.
# Counts and exclusions come from keural-sft-training-guide.md §2 (verified against
# each repo's README/license table on 2026-07-08).
#
# Total target after the 2026-07-09 Mkd-Yonas addition: ~263k rows pre-dedup
# (157k mkd-chanwoo + ~106k Mkd-Yonas), before eval/pilot split and dedup drops.

output:
  train_file: "data/processed/train.jsonl"
  eval_file: "data/processed/eval.jsonl"
  pilot_file: "data/processed/pilot.jsonl"          # proportional ~5k slice, guide §4
  manifest_file: "data/processed/dataset_manifest.json"
  stats_file: "data/processed/dataset_stats.json"

eval_split:
  fraction: 0.01
  max_examples: 2000

pilot:
  total_examples: 5000

# Every source row is {"text": <ChatML str>, "source_name": str, "license": str, "n_tokens": int}
sources:
  - name: keural_conversation_ko
    repo: "mkd-chanwoo/keural-conversation-chatml-ko"
    revision: "64a8c45cf5d777b77fe8e1351e5a52da9dd6868b"
    files: ["keural_conversation_shard_0000.jsonl"]
    sample: 40000
    available: 133339
  - name: keural_rag_ko
    repo: "mkd-chanwoo/keural-rag-chatml-ko"
    revision: "aa9023d231a3451d25135d5aa84b12b48ca06450"
    # NOTE: this repo's manifest.json is STALE (lists a conversation shard that was
    # moved to its own repo). File list below is the verified truth — do not glob
    # from the manifest.
    files: ["keural_synthetic_sft_shard_0000.jsonl"]
    sample: 40000
    available: 303355
  - name: keural_sft_ko
    repo: "mkd-chanwoo/keural-SFT"
    revision: "ce73cdc04d4b0e2a1cc4d69deb94749691d6ab2c"
    files: "shard_*.jsonl"          # 115 shards; fully present in local HF cache
    include_source_names: [orca_math_korean, koinstruct_qa, koinstruct_base, koalpaca]
    sample: 50000
    available: 294028
  - name: keural_sft_en
    repo: "mkd-chanwoo/keural-SFT"
    revision: "ce73cdc04d4b0e2a1cc4d69deb94749691d6ab2c"
    files: "shard_*.jsonl"
    include_source_names: [ultrachat, openorca, alpaca, magicoder, mathinstruct, gsm8k]
    sample: 12000
  - name: keural_qa_en
    repo: "mkd-chanwoo/keural-QA-chatml-en"
    revision: "29088c640d47e1cbc380230595d4316e70272efe"
    files: ["keural_qa_en_shard_0000.jsonl", "keural_qa_en_shard_0001.jsonl"]
    sample: 15000
    available: 1580359

