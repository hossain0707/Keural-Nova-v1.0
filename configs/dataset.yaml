# Optional company/domain data (guide §2: 15k–20k). JSONL, either already in
# {"messages": [...]} schema or {"text": <ChatML>}. Skipped with a warning if null.
company_data:
  path: null
  sample: 20000

# License exclusions (guide §2, assumes worst-case AI Hub terms — see the guide's
# action item about confirming with chanwoo before relaxing these).
exclusions:
  source_names: [aihub_multisession_sci, aihub_multisession_social, aihub_expert_qa]
  # belt-and-braces: drop any row whose license field matches (case-insensitive)
  license_regex: "(nc|non[-_ ]?commercial|aihub)"

format:
  # Prefix added to EVERY assistant turn (guide §3: empty-think, applied everywhere).
  think_prefix: "<think>\n\n</think>\n\n"
  max_tokens_per_example: 8192     # source data truncation; rows above this are dropped
  drop_if_no_assistant: true

dedup:
  enabled: true                    # exact-hash dedup on normalized text
