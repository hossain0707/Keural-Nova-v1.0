# Stage 7 (v1.2 experimental) — merge, model card, upload.
# New dirs + new repo only; nothing existing is overwritten.

merge:
  # Final checkpoint of the v1.2 experimental run (adapter preserved in kept/).
  checkpoint: "outputs/v12/kept/checkpoint-5068"
  merged_dir: "outputs/v12/merged/Keural-Nova-v1.2-experimental"
  preserve_mtp: true          # re-inject mtp.* from base shards (VERIFIED-FACTS §0.4)
  copy_aux_files: true        # ship tokenizer/processor files
  # NOTE (pipeline step, not a merge_lora flag): after merge, re-apply the non-thinking
  # chat-template fix by copying chat_template.jinja + tokenizer_config.json from the
  # verified v1.1 merge (outputs/merged/Keural-35B-A3B) — base template defaults to
  # THINKING and would reintroduce the tool-calling loop.

model_card:
  name: "Keural-Nova-v1.2-experimental"
  base_model: "Qwen/Qwen3.6-35B-A3B"
  license: "apache-2.0"
  languages: [ko, en]
  baseline_results: null      # auto: latest results/<base tag>/*/summary.json
  trained_results: null       # auto: latest results/<v12 tag>/*/summary.json

upload:
  repo: "mkd-ai/Keural-Nova-v1.2-experimental"   # NEW repo (user decision)
  private: false                                  # PUBLIC (user decision)
